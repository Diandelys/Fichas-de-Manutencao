<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#1B4F8A" />

  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Formulário Serviço - PesoExato" />

  <title>Formulário de Serviço — PesoExato</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Compiled Tailwind & PesoExato CSS -->
  <link rel="stylesheet" href="./css/tailwind.min.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="manifest" href="./manifest.json" />

  <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.ico" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>

  <style>
    .signature-canvas {
      border: 1px solid var(--pe-border-default);
      border-radius: var(--pe-radius-md);
      background-color: var(--pe-surface);
      cursor: crosshair;
      touch-action: none;
    }

    .photo-preview {
      border-radius: var(--pe-radius-md);
      object-fit: cover;
      height: 120px;
      width: 120px;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-online {
      background-color: var(--pe-color-success-main);
    }

    .status-offline {
      background-color: var(--pe-color-danger-main);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 14, 13, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: var(--pe-radius-lg);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px;
      border-radius: var(--pe-radius-md);
      color: white;
      z-index: 1000;
      display: none;
      box-shadow: var(--pe-shadow-lg);
    }

    .notification.success {
      background-color: var(--pe-color-success-main);
    }

    .notification.error {
      background-color: var(--pe-color-danger-main);
    }

    .notification.info {
      background-color: var(--pe-action-primary-bg);
    }
  </style>
</head>

<body class="min-h-screen">
  <header class="bg-white border-b border-[#E5E7EB] sticky top-0 z-50 shadow-xs">
    <div class="container mx-auto px-4 py-2.5 sm:flex sm:justify-between sm:items-center">
      <div class="flex justify-between items-center w-full sm:w-auto">
        <div class="flex items-center space-x-2.5">
          <div class="bg-[#1B4F8A] text-white p-2 rounded-lg flex items-center justify-center shrink-0">
            <i class="fas fa-balance-scale text-lg sm:text-xl"></i>
          </div>
          <div>
            <h1 class="text-sm sm:text-lg font-bold text-[#0F0E0D]">Formulário de Serviço</h1>
            <p class="text-[10px] sm:text-xs text-[#6B6965] pe-mono">PESO EXATO SOLUTIONS</p>
          </div>
        </div>

        <!-- Botão de Expandir/Recolher no Mobile -->
        <button id="toggle-header-controls-btn" class="sm:hidden text-[#6B6965] hover:text-[#0F0E0D] p-1.5 rounded bg-[#F2F1EE] border border-[#E5E7EB] text-xs flex items-center justify-center cursor-pointer" title="Recolher / Expandir botões">
          <i id="toggle-controls-icon" class="fas fa-chevron-down text-[11px]"></i>
        </button>
      </div>

      <!-- Container dos Controles: no mobile aparece ABAIXO do título, um ao lado do outro -->
      <div id="header-controls-container" class="hidden sm:flex flex-row items-center justify-end gap-2 pt-2 mt-2 border-t border-[#E5E7EB] sm:border-0 sm:mt-0 sm:pt-0 sm:gap-2.5">
        <button id="toggle-auto-sync-btn" class="pe-btn pe-btn-secondary text-[11px] sm:text-xs py-1 px-2.5 sm:py-1.5 sm:px-3 h-auto min-h-0 leading-tight"
          aria-pressed="false" title="Alterna entre sincronização automática e manual">
          <i class="fas fa-sync-alt text-[10px] sm:text-xs"></i>
          <span id="toggle-auto-sync-text">Sync: Ativo</span>
        </button>
        <button id="sync-btn" class="pe-btn pe-btn-primary text-[11px] sm:text-xs py-1 px-2.5 sm:py-1.5 sm:px-3 h-auto min-h-0 leading-tight relative">
          <i class="fas fa-sync-alt text-[10px] sm:text-xs"></i> Sincronizar
          <span id="sync-badge"
            class="absolute -top-1.5 -right-1.5 bg-[#DC2626] text-white rounded-full text-[9px] w-4 h-4 flex items-center justify-center hidden pe-mono">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-5xl">
    <section class="pe-card mb-6">
      <div class="pe-card-header flex justify-between items-center flex-wrap gap-2">
        <h2 class="text-base sm:text-lg font-semibold text-[#0F0E0D] flex items-center">
          <i class="fas fa-clipboard-list text-[#1B4F8A] mr-2.5"></i> Dados do Serviço
        </h2>
        <div id="status" class="flex items-center text-[11px] font-medium px-2.5 py-1 rounded-full bg-[#F2F1EE]">
          <span id="status-indicator" class="status-indicator status-offline"></span>
          <span id="status-text" class="text-[#6B6965]">Offline</span>
        </div>
      </div>

      <div class="pe-card-body">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-4">
            <div>
              <label for="cliente" class="pe-label pe-label-required">Cliente</label>
              <input type="text" id="cliente" required placeholder="Nome / Razão Social do cliente"
                class="pe-input" />
            </div>

            <div>
              <label for="cidade" class="pe-label pe-label-required">Cidade - UF</label>
              <input type="text" id="cidade" required placeholder="Cidade - UF"
                class="pe-input" />
            </div>

            <div>
              <label for="equipamento" class="pe-label pe-label-required">Equipamento</label>
              <select id="equipamento" required class="pe-input">
                <option value="">Selecione o equipamento</option>
                <option value="SELAVES WI-FI">SELAVES WI-FI</option>
                <option value="SELAVES">SELAVES</option>
                <option value="CLASSAVE">CLASSAVE</option>
                <option value="PS/SEL - WIFI">PS/SEL - WIFI</option>
                <option value="BD15-SD/PS">BD15-SD/PS</option>
                <option value="BD15-SD/SEL">BD15-SD/SEL</option>
                <option value="BD15-BT">BD15-BT</option>
                <option value="BCD-15">BCD-15</option>
                <option value="SP-501">SP-501</option>
                <option value="SP-300">SP-300</option>
                <option value="SP-SEQ">SP-SEQ</option>
                <option value="CS-P">CS-P</option>
                <option value="CS-R">CS-R</option>
                <option value="OUTRO">OUTRO</option>
              </select>
              <input type="text" id="equipamento-outro" placeholder="Especifique o equipamento"
                class="pe-input mt-2 hidden" />
            </div>

            <div>
              <label for="tecnico" class="pe-label pe-label-required">Técnico Responsável</label>
              <input type="text" id="tecnico" required placeholder="Nome do técnico"
                class="pe-input" />
            </div>

            <div>
              <label for="servico" class="pe-label pe-label-required">Serviço Prestado</label>
              <select id="servico" required class="pe-input">
                <option value="">Selecione o tipo de serviço</option>
                <option value="INSTALAÇÃO">INSTALAÇÃO</option>
                <option value="STARTUP">STARTUP</option>
                <option value="MANUTENÇÃO">MANUTENÇÃO</option>
                <option value="ENTREGA">ENTREGA</option>
              </select>
            </div>
          </div>

          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label for="data-inicial" class="pe-label pe-label-required">Data Inicial</label>
                <input type="date" id="data-inicial" required class="pe-input pe-mono" />
              </div>
              <div>
                <label for="hora-inicial" class="pe-label pe-label-required">Hora Inicial</label>
                <input type="time" id="hora-inicial" required class="pe-input pe-mono" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label for="data-final" class="pe-label pe-label-required">Data Final</label>
                <input type="date" id="data-final" required class="pe-input pe-mono" />
              </div>
              <div>
                <label for="hora-final" class="pe-label pe-label-required">Hora Final</label>
                <input type="time" id="hora-final" required class="pe-input pe-mono" />
              </div>
            </div>

            <div>
              <label for="veiculo" class="pe-label">Veículo / Placa</label>
              <input type="text" id="veiculo" placeholder="Identificação do veículo" class="pe-input" />
            </div>

            <div>
              <label for="estoque" class="pe-label">Estoque Origem</label>
              <select id="estoque" class="pe-input">
                <option value="">Selecione o estoque</option>

                <!-- Estoques de pessoas -->
                <option value="ANDERSON 66">ANDERSON 66</option>
                <option value="ANDRÉ 30">ANDRÉ 30</option>
                <option value="LUCAS 33">LUCAS 33</option>

                <!-- Estoques de sequencial -->
                <option value="SEQUENCIAL 18">SEQUENCIAL 18</option>
                <option value="SEQUENCIAL 19">SEQUENCIAL 19</option>
                <option value="SEQUENCIAL 20">SEQUENCIAL 20</option>
                <option value="SEQUENCIAL 23">SEQUENCIAL 23</option>
                <option value="SEQUENCIAL 26">SEQUENCIAL 26</option>
                <option value="SEQUENCIAL 27">SEQUENCIAL 27</option>
                <option value="SEQUENCIAL 32">SEQUENCIAL 32</option>
                <option value="SEQUENCIAL 50">SEQUENCIAL 50</option>
                <option value="SEQUENCIAL 61">SEQUENCIAL 61</option>

                <!-- Estoques de coleta solo -->
                <option value="COLETA SOLO">COLETA SOLO</option>
                <option value="CS 55">CS 55</option>
                <option value="CS 56">CS 56</option>

                <!-- Estoques de selaves -->
                <option value="SELAVES 16">SELAVES 16</option>
                <option value="SELAVES 22">SELAVES 22</option>
                <option value="SELAVES 29">SELAVES 29</option>
                <option value="SELAVES 44">SELAVES 44</option>
                <option value="SELAVES 53">SELAVES 53</option>
                <option value="SELAVES 54">SELAVES 54</option>
                <option value="SELAVES RESERVA">SELAVES RESERVA</option>

                <!-- Estoques de SP-501 -->
                <option value="SP-501 48">SP-501 48</option>
                <option value="SP-501 NOVO 01">SP-501 NOVO 01</option>
                <option value="SP-501 NOVO 02">SP-501 NOVO 02</option>

                <!-- Estoque da manutenção -->
                <option value="MANUTENÇÃO 45">MANUTENÇÃO 45</option>
              </select>
            </div>

            <div>
              <label for="numero-serie" class="pe-label">Nº de Série / TAG</label>
              <input type="text" id="numero-serie" placeholder="####/ANO" class="pe-input pe-mono" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="pe-card mb-6">
      <div class="pe-card-header">
        <h2 class="text-lg font-semibold text-[#0F0E0D] flex items-center">
          <i class="fas fa-file-alt text-[#1B4F8A] mr-2.5"></i> Relatório Técnico
        </h2>
      </div>

      <div class="pe-card-body">
        <div>
          <label for="relatorio-maquina" class="pe-label pe-label-required">Defeitos Encontrados e Soluções Aplicadas</label>
          <textarea id="relatorio-maquina" rows="5" required placeholder="Descreva detalhadamente os sintomas, testes metrológicos efetuados e ações corretivas..."
            class="pe-input"></textarea>
        </div>
      </div>
    </section>

    <section class="pe-card mb-6">
      <div class="pe-card-header">
        <h2 class="text-lg font-semibold text-[#0F0E0D] flex items-center">
          <i class="fas fa-camera text-[#1B4F8A] mr-2.5"></i> Registros Fotográficos
        </h2>
        <span class="text-xs text-[#6B6965]">Máximo: 10 fotos</span>
      </div>

      <div class="pe-card-body">
        <div class="mb-4">
          <input type="file" id="fotos-input" accept="image/*" multiple class="hidden" />
          <button id="add-fotos-btn" class="pe-btn pe-btn-secondary">
            <i class="fas fa-plus"></i> Adicionar Fotos
          </button>
        </div>

        <div id="fotos-preview" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
      </div>
    </section>

    <section class="pe-card mb-6">
      <div class="pe-card-header">
        <h2 class="text-lg font-semibold text-[#0F0E0D] flex items-center">
          <i class="fas fa-signature text-[#1B4F8A] mr-2.5"></i> Validação & Assinaturas
        </h2>
      </div>

      <div class="pe-card-body">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div>
            <h3 class="text-sm font-semibold text-[#0F0E0D] mb-3 uppercase tracking-wide">
              Assinatura do Cliente
            </h3>
            <div class="mb-3">
              <label for="cliente-nome" class="pe-label pe-label-required">Nome Completo do Responsável</label>
              <input type="text" id="cliente-nome" required placeholder="Nome do representante" class="pe-input" />
            </div>
            <canvas id="assinatura-cliente" class="signature-canvas w-full h-40"></canvas>
            <div class="flex items-center justify-between mt-3">
              <button id="limpar-cliente" class="text-xs text-[#DC2626] hover:underline flex items-center gap-1 font-medium">
                <i class="fas fa-eraser"></i> Limpar Assinatura
              </button>
              <label class="inline-flex items-center cursor-pointer text-xs text-[#6B6965]">
                <input type="checkbox" id="lock-cliente" class="rounded border-[#E5E7EB] text-[#1B4F8A] mr-1.5 focus:ring-[#1B4F8A]" />
                Bloquear Assinatura
              </label>
            </div>
          </div>

          <div>
            <h3 class="text-sm font-semibold text-[#0F0E0D] mb-3 uppercase tracking-wide">
              Assinatura do Técnico
            </h3>
            <div class="mb-3">
              <label for="tecnico-nome" class="pe-label pe-label-required">Nome Completo do Técnico</label>
              <input type="text" id="tecnico-nome" required placeholder="Nome do técnico executante" class="pe-input" />
            </div>
            <canvas id="assinatura-tecnico" class="signature-canvas w-full h-40"></canvas>
            <div class="flex items-center justify-between mt-3">
              <button id="limpar-tecnico" class="text-xs text-[#DC2626] hover:underline flex items-center gap-1 font-medium">
                <i class="fas fa-eraser"></i> Limpar Assinatura
              </button>
              <label class="inline-flex items-center cursor-pointer text-xs text-[#6B6965]">
                <input type="checkbox" id="lock-tecnico" class="rounded border-[#E5E7EB] text-[#1B4F8A] mr-1.5 focus:ring-[#1B4F8A]" />
                Bloquear Assinatura
              </label>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="pe-card mb-6">
      <div class="pe-card-header">
        <h2 class="text-lg font-semibold text-[#0F0E0D] flex items-center">
          <i class="fas fa-boxes text-[#1B4F8A] mr-2.5"></i> Materiais & Peças Utilizadas
        </h2>
      </div>

      <div class="pe-card-body">
        <div class="mb-4">
          <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" id="material-input" list="materiais-list" placeholder="Código ou descrição da peça/material"
              class="pe-input flex-1 pe-mono" />
            <datalist id="materiais-list"></datalist>
            <input type="number" id="material-qtd" min="1" placeholder="Qtd"
              class="pe-input w-full sm:w-28 pe-mono" />
            <button id="add-material-btn" class="pe-btn pe-btn-primary">
              <i class="fas fa-plus"></i> Adicionar
            </button>
          </div>
        </div>

        <div id="materiais-lista" class="space-y-2"></div>
      </div>
    </section>

    <div class="flex flex-col sm:flex-row sm:justify-end gap-4 mt-8">
      <button id="export-btn" class="pe-btn pe-btn-primary pe-btn-lg">
        <i class="fas fa-download"></i> Salvar e Gerar Relatório
      </button>
      <button id="clear-form-btn" class="pe-btn pe-btn-secondary pe-btn-lg text-[#DC2626]">
        <i class="fas fa-eraser"></i> Limpar Formulário
      </button>
    </div>
  </main>

  <div id="image-modal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modal-image" />
  </div>

  <div id="notification" class="notification hidden">
    <div class="flex items-center">
      <i id="notification-icon" class="mr-2"></i>
      <span id="notification-text" class="text-sm font-medium"></span>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
